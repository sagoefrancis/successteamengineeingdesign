<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>S.T.E.D | Admin Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-shell { max-width: 380px; margin: 12vh auto; padding: 2rem; }
    .login-shell form { display: flex; flex-direction: column; gap: 1rem; }
    .login-shell label { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.9rem; }
    .login-shell input { padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); }
    .login-shell .form-status { min-height: 1.2em; font-size: 0.85rem; }
  </style>
</head>
<body class="admin-page">
  <div class="site-shell login-shell">
    <p class="eyebrow"><span>ADMIN</span> Sign in</p>
    <h1>Private workspace</h1>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="admin-submit" type="submit"><span>Sign in</span></button>
      <p class="form-status" id="loginStatus" role="status"></p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="database.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginStatus = document.getElementById('loginStatus');

    (async function redirectIfSignedIn() {
      const session = await getAdminSession();
      if (session) window.location.href = 'admin.html';
    })();

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginStatus.textContent = 'Signing in...';
      try {
        await signInAdmin(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        window.location.href = 'admin.html';
      } catch (err) {
        const message = err && err.message
          ? err.message
          : 'Sign in failed. Check your email and password.';
        loginStatus.textContent = message;
      }
    });
  </script>
</body>
</html>
